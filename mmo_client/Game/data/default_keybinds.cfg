# Key bindings, read by Game/src/core/keybinds.c at startup.
# One binding per line: name=KEY, no spaces. A line starting with # is ignored.
# A missing or unknown entry keeps its default.
# Keys: A-Z, 0-9, F1-F12, SPACE, ENTER, TAB, BACKSPACE, ESCAPE, HOME,
#       LEFT, RIGHT, UP, DOWN, LSHIFT, RSHIFT, LCTRL, RCTRL, LALT, RALT, KP0-KP9,
#       KP_DECIMAL, KP_DIVIDE, KP_MULTIPLY, KP_SUBTRACT, KP_ADD, KP_ENTER,
#       MINUS, EQUAL, COMMA, PERIOD, SEMICOLON, APOSTROPHE, LBRACKET, RBRACKET,
#       BACKSLASH, SLASH, GRAVE, PAGEUP, PAGEDOWN, INSERT, DELETE, END, CAPSLOCK,
#       MOUSE1 (left), MOUSE2 (right), MOUSE3 (middle), MOUSE4, MOUSE5

# Movement
move_up=W
move_down=S
move_left=A
move_right=D
toggle_walk=LCTRL
sprint=LSHIFT
 
#Chat
toggle_chat=T
toggle_channel=TAB

# Combat
basic_attack=MOUSE2
swap_form=F
ability_1=1
ability_2=2
ability_3=3
ability_4=4
ability_5=5
ability_6=6
ability_7=7
ability_8=8
ability_9=9
ability_10=0
ability_11=MINUS
ability_12=EQUAL

# 
interact=MOUSE1
toggle_inventory=I
toggle_character=C
inspect_target=K
toggle_quest_log=J
toggle_friends=U
toggle_currency=G
party_leave=P
toggle_session_panel=O
toggle_map=M
toggle_emote_hub=H
toggle_weather=Y

# Emotes (pick their clips in the emote hub)
emote_1=Z
emote_2=X
emote_3=V

# Camera
camera_rotate_left=Q
camera_rotate_right=E
camera_reset=HOME
