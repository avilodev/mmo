# The build, the tests, the cross-tree checks and the sanitizers, for both
# trees.
#
# Client and server used to be two repositories, and the server's CI had to
# check the client out beside it -- falling back to the client's default branch
# when a branch existed in only one of them -- so the cross-tree checks had
# something to compare. One checkout now holds both trees in the layout the
# scripts expect:
#
#     mmo_server/
#     mmo_client/
#
# so a branch always compares the server and client that were committed
# together.
#
# The client's Windows build (and the Win32 Launcher) is not attempted here.

name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest

    services:
      # A throwaway PostgreSQL, so character_items_db_test actually runs.
      # It is the only test that exercises item persistence and the only one
      # that calls item_instance_seed() -- which is why the instance-id defect
      # that corrupted inventories survived a green `make test` for as long as
      # it did: the test that would have caught it skips itself when
      # MMO_TEST_PGCONN is unset, and it was never set.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_world
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libsqlite3-dev libhiredis-dev libpq-dev \
            libssl-dev libsodium-dev postgresql-client redis-tools

      - name: Build with warnings as errors
        working-directory: mmo_server
        run: make strict

      # MMO_CLIENT_ROOT is set explicitly rather than relying on the sibling
      # default, so a missing client tree fails this step instead of silently
      # skipping every cross-tree check and going green.
      - name: Cross-tree checks
        working-directory: mmo_server
        env:
          MMO_CLIENT_ROOT: ${{ github.workspace }}/mmo_client
        run: |
          ./tests/check_tree_pairing.sh
          ./tests/check_protocol_version.sh
          ./tests/check_protocol_sync.sh
          ./tests/check_single_definition.sh
          ./tests/check_pinning_sync.sh
          ./tests/check_client_content.sh

      # The world file is a gigabyte at its shipped size, so CI generates a
      # small one: what is being checked is that the generator and both readers
      # agree about the layout, which does not depend on how big the world is.
      - name: Generate a small world and check the format
        run: |
          cd mmo_client
          make Game/data/bin/worldgen
          ./Game/data/bin/worldgen /tmp/world.dat 256 256
          mkdir -p ../mmo_server/world_server/data ../mmo_server/world_server/bin/data
          cp /tmp/world.dat ../mmo_server/world_server/data/world.dat
          cp /tmp/world.dat ../mmo_server/world_server/bin/data/world.dat
          cd ../mmo_server
          ./tests/check_world_format.sh

      - name: Prepare the throwaway database
        env:
          PGPASSWORD: ci
        run: |
          psql -h 127.0.0.1 -U postgres -d ci_world -c "SELECT version();"

      - name: Server tests
        working-directory: mmo_server
        env:
          # The one test that touches PostgreSQL. It skips itself, successfully,
          # when this is unset -- which is how the item-instance defect stayed
          # hidden behind a green suite.
          MMO_TEST_PGCONN: "host=127.0.0.1 port=5432 dbname=ci_world user=postgres password=ci"
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
        run: make test

      - name: Server sanitizers
        working-directory: mmo_server
        run: make sanitize

      - name: Upload sanitizer logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-logs
          path: /tmp/*_tsan.log
          if-no-files-found: ignore

  # The whole game tree builds and tests on Linux: the Makefile resolves GLFW,
  # OpenGL and OpenSSL through pkg-config, and the network sources build
  # against the Winsock shim in Game/tests/hostcompat.
  client:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mmo_client

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libglfw3-dev libgl-dev libssl-dev

      - name: Tests
        run: make test

      - name: Build the game with warnings as errors
        run: make strict

      - name: Packet dispatchers under ASan and UBSan
        run: make net-sanitize
