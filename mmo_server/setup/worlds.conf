# The world table. One row per world, in world_id order.
#
# Every service reads this file at startup. It is the one place the world
# roster lives, and it feeds:
#
#   * the realm's world list and world identifiers (row order sets world_id)
#   * each world server's PostgreSQL database
#   * every world's display name, wherever one is logged or sent
#   * `make setup`: the databases, world_server/world_config/<Name>.conf, and
#     the key list in common/server_keys/generate_daily_server_keys.sh
#
# The Makefile packages it beside each binary as bin/data/worlds.conf, which is
# where the servers read it from. `$MMO_WORLDS_CONF` overrides that path.
#
# There is no compiled copy of this mapping any more, and no second world list
# to keep in step: the three hardcoded C ladders in world_database_config.c and
# the generated realm_server/worlds/worlds.txt are both gone. Adding a world is
# one row here plus `make setup && make`.
#
# There is no ceiling on how many rows this file may hold -- the servers size
# their tables from it. One WORLD_LIST response packet still carries at most
# MAX_WORLDS entries (common/include/protocol.h), so a roster longer than that
# is monitored in full but listed to clients in part, with a warning.
#
# ---------------------------------------------------------------------------
# Columns, whitespace-separated:
#
#   name        World name. Also the .conf basename and the realm's display name.
#   region      Region label shown in the launcher. Use _ for spaces.
#   database    PostgreSQL database name.
#   host        Address clients and the realm connect to.
#   port        TCP port.
#   max_players Capacity. Must be <= MAX_PLAYERS in common/include/types.h.
#   hardcore    1 or 0.
#   realm_port  OPTIONAL eighth column. The port the realm's heartbeat link
#               connects to. Omitted, it is `port + 1000`.
#
#               The realm link used to share the client port and was told apart
#               by peeking at the first byte of every accepted connection, so
#               the privileged server-to-server handshake was reachable from
#               anywhere a player could reach -- gated only by an allowlist
#               applied after the accept. It has its own listener now. Give it
#               a port here only if the default collides with something; the
#               world's own .conf can also bind it to a private interface with
#               `realm_bind`, which is the stronger control.
#
#               Client ports and realm ports share one namespace. `make setup`
#               refuses a file where any two of them collide.
#
# ROW ORDER MATTERS. A world's identifier is its position in this file, and
# that identifier is what a saved character's world ticket and every world
# database lookup are keyed on. Reordering rows renumbers every world.
#
# CHANGING host: set it to an address remote clients can reach. The world's own
# address is added to its realm-handshake allowlist automatically, so the realm
# on the same machine keeps working. A realm on a DIFFERENT machine needs an
# explicit `realm_allow` line in that world's .conf.
#
# ---------------------------------------------------------------------------
# Optional settings, given as `key = value` anywhere in the file. Each has a
# matching environment variable that overrides whatever is written here, which
# is how one checked-in file serves more than one deployment.
#
#   pg_host      $MMO_PG_HOST       PostgreSQL host        (default localhost)
#   pg_port      $MMO_PG_PORT       PostgreSQL port        (default: libpq's)
#   pg_user      $MMO_PG_USER       Role to connect as     (default postgres)
#   pg_password  $MMO_PG_PASSWORD   Password               (prefer ~/.pgpass)
#   pg_sslmode   $MMO_PG_SSLMODE    e.g. require, verify-full
#   pg_options   $MMO_PG_OPTIONS    Extra libpq options
#
# Only the database name differs per world, so the rest is configured once.
# ---------------------------------------------------------------------------

# name        region          database       host        port  max_players  hardcore  [realm_port]
